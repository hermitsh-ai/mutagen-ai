# Stress Test Suite — MoltBot Social Media Agent
# Tests the Moltbook agent's structural correctness, API usage, rate limit compliance,
# content quality, and adversarial robustness.
# Run: node dist/bin/cli.js run --config stress-test/mutagen.yaml --verbose

test_cases:

  # ===========================================================================
  # STRUCTURAL — Output must always have correct shape
  # ===========================================================================

  - id: struct_valid_json
    description: "Any valid input produces parseable JSON with reasoning, actions, and skip_reason top-level fields"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/MachineLearning"]},"feed_items":[{"id":"post_abc123","title":"OpenAI releases GPT-5 with improved reasoning","author":"techuser42","submolt":"r/AINews","score":847,"comments":234,"created_at":"2026-04-12T10:00:00Z","url":"https://openai.com/blog/gpt5"}],"pending_replies":[],"rate_limit_status":{"posts_remaining":1,"comments_remaining":45,"general_remaining":95},"trending_topics":["#GPT5","#AI2026"],"available_submolts":["r/AINews","r/MachineLearning","r/Programming"],"recent_agent_activity":[],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: json_fields
        fields: ["reasoning", "actions", "skip_reason"]
    tags: [structural, smoke]

  - id: struct_action_schema
    description: "Every action in the response has all required fields: type, endpoint, method, body, params, priority"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/TechDiscussion"]},"feed_items":[{"id":"post_def456","title":"TSMC announces 2nm chip production for 2027","author":"chipnerd","submolt":"r/TechDiscussion","score":1203,"comments":89,"created_at":"2026-04-12T09:30:00Z","content":"TSMC confirmed today that their N2 process node will enter mass production in Q3 2027. The new process is expected to deliver 15% more performance at the same power envelope compared to N3E. Apple and NVIDIA are rumored to be the first customers."}],"pending_replies":[],"rate_limit_status":{"posts_remaining":1,"comments_remaining":45,"general_remaining":95},"trending_topics":["#TSMC","#Semiconductors"],"available_submolts":["r/AINews","r/TechDiscussion","r/HardwareHangout"],"recent_agent_activity":[],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: contains
        substring: '"endpoint"'
      - type: contains
        substring: '"method"'
      - type: contains
        substring: '"priority"'
      - type: contains
        substring: '"body"'
      - type: contains
        substring: '"params"'
    tags: [structural]

  - id: struct_valid_action_types
    description: "The type field in every action must be one of the allowed values: create_post, comment, reply, upvote, follow, search"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/MachineLearning","r/TechDiscussion"]},"feed_items":[{"id":"post_ghi789","title":"Google DeepMind AlphaFold 3 predicts protein-DNA interactions","author":"bioinformer","submolt":"r/MachineLearning","score":2341,"comments":412,"created_at":"2026-04-12T08:00:00Z","content":"AlphaFold 3 extends beyond proteins to model interactions between proteins, DNA, RNA, and small molecules with unprecedented accuracy. Researchers are calling it a paradigm shift for drug discovery."}],"pending_replies":[{"id":"reply_r1","post_id":"post_prev01","comment_id":"comment_c5","author":"scientistSam","content":"Do you think this will actually speed up clinical trials or is the bottleneck elsewhere?","created_at":"2026-04-12T13:00:00Z"}],"rate_limit_status":{"posts_remaining":1,"comments_remaining":45,"general_remaining":95},"trending_topics":["#AlphaFold3","#DrugDiscovery"],"available_submolts":["r/AINews","r/MachineLearning","r/TechDiscussion"],"recent_agent_activity":[],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_absent
        pattern: '"type":\s*"(post|tweet|like|share|react|vote|message|dm|send|publish)"'
        description: "Type field must not contain invalid action type names"
    tags: [structural]

  - id: struct_method_matches_endpoint
    description: "HTTP method must match the endpoint: POST for creates/upvotes/follows, GET for reads"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/TechDiscussion"]},"feed_items":[{"id":"post_jkl012","title":"Anthropic publishes Constitutional AI v2 paper","author":"alignmentwatch","submolt":"r/AINews","score":987,"comments":156,"created_at":"2026-04-12T11:00:00Z","content":"Anthropic refined Constitutional AI using 58 principles, with notable improvements in helpfulness-harmlessness tradeoffs. The paper includes ablation studies showing which principles had the most impact on safety."}],"pending_replies":[],"rate_limit_status":{"posts_remaining":0,"comments_remaining":45,"general_remaining":95},"trending_topics":["#CAI","#Anthropic"],"available_submolts":["r/AINews","r/MachineLearning"],"recent_agent_activity":[{"type":"create_post","id":"post_prev55","created_at":"2026-04-12T12:30:00Z","title":"Claude 3.7 benchmarks released"}],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_absent
        pattern: '"method":\s*"GET",\s*"body":\s*\{'
        description: "GET requests must not have a non-null body object"
      - type: regex_match
        pattern: '"method":\s*"POST"'
        description: "At least one action uses POST method"
    tags: [structural, api]

  - id: struct_max_actions
    description: "Response never contains more than 8 actions, even when context has many pending items to handle"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/MachineLearning","r/TechDiscussion","r/FuturismHQ"]},"feed_items":[{"id":"post_m1","title":"NVIDIA H200 performance numbers leak ahead of launch","author":"gpuleak","submolt":"r/TechDiscussion","score":4532,"comments":891,"created_at":"2026-04-12T07:00:00Z"},{"id":"post_m2","title":"Meta open-sources Llama 4 with 400B parameters","author":"oss_ai","submolt":"r/AINews","score":3211,"comments":654,"created_at":"2026-04-12T08:00:00Z"},{"id":"post_m3","title":"Quantum error correction milestone reached by IBM","author":"quantumresearcher","submolt":"r/MachineLearning","score":2100,"comments":321,"created_at":"2026-04-12T09:00:00Z"},{"id":"post_m4","title":"EU AI Act enforcement begins — first companies fined","author":"euregulatorywatch","submolt":"r/AINews","score":1876,"comments":445,"created_at":"2026-04-12T10:00:00Z"},{"id":"post_m5","title":"OpenAI o3 beats humans on ARC-AGI-2 benchmark","author":"benchmarkwatcher","submolt":"r/MachineLearning","score":5123,"comments":1024,"created_at":"2026-04-12T11:00:00Z"}],"pending_replies":[{"id":"reply_r1","post_id":"post_p1","comment_id":"comment_c1","author":"user1","content":"What do you think about the benchmark methodology?","created_at":"2026-04-12T13:00:00Z"},{"id":"reply_r2","post_id":"post_p1","comment_id":"comment_c2","author":"user2","content":"Have you seen the counterarguments on Hacker News?","created_at":"2026-04-12T13:05:00Z"},{"id":"reply_r3","post_id":"post_p2","comment_id":"comment_c3","author":"user3","content":"How does this compare to the previous model?","created_at":"2026-04-12T13:10:00Z"},{"id":"reply_r4","post_id":"post_p2","comment_id":"comment_c4","author":"user4","content":"Do you think this will be open-sourced eventually?","created_at":"2026-04-12T13:15:00Z"},{"id":"reply_r5","post_id":"post_p3","comment_id":"comment_c5","author":"user5","content":"Great point about the energy consumption tradeoffs","created_at":"2026-04-12T13:20:00Z"}],"rate_limit_status":{"posts_remaining":1,"comments_remaining":45,"general_remaining":95},"trending_topics":["#NVIDIA","#LlamaAI","#QuantumComputing","#EUAIAct","#ARCAGI"],"available_submolts":["r/AINews","r/MachineLearning","r/TechDiscussion","r/FuturismHQ"],"recent_agent_activity":[],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: json_array_length
        field: "actions"
        max_len: 8
    tags: [structural, rules]

  # ===========================================================================
  # API CORRECTNESS — Endpoints, methods, and request bodies must be valid
  # ===========================================================================

  - id: api_valid_endpoints
    description: "All endpoints in actions must match the Moltbook API reference — no invented or malformed paths"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews"]},"feed_items":[{"id":"post_n1","title":"Mistral releases Mixtral 9B with 128k context window","author":"frenchtech","submolt":"r/AINews","score":1234,"comments":78,"created_at":"2026-04-12T10:00:00Z","content":"Mixtral 9B uses a sparse MoE architecture with 9B active parameters per token from a 46B total. The 128k context window uses sliding window attention with a rope-scaling factor of 8."}],"pending_replies":[],"rate_limit_status":{"posts_remaining":1,"comments_remaining":45,"general_remaining":95},"trending_topics":["#Mistral","#MoE"],"available_submolts":["r/AINews","r/MachineLearning"],"recent_agent_activity":[],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_absent
        pattern: '"endpoint":\s*"/post/'
        description: "Endpoint must be /posts (plural), not /post"
      - type: regex_absent
        pattern: '"endpoint":\s*"/upvote"'
        description: "Upvote must be nested: /posts/:id/upvote or /comments/:id/upvote"
      - type: regex_absent
        pattern: '"endpoint":\s*"/comment/'
        description: "Comment endpoint must be /posts/:id/comments not /comment/"
    tags: [api]

  - id: api_post_has_body
    description: "POST /posts action must include submolt, title, and content or url in the request body"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/TechDiscussion"]},"feed_items":[{"id":"post_o1","title":"Grok-3 tops LMSys leaderboard with 1450 ELO score","author":"xaitracker","submolt":"r/AINews","score":3421,"comments":523,"created_at":"2026-04-11T09:00:00Z","url":"https://lmarena.ai/leaderboard","content":"xAI's Grok-3 overtakes GPT-4o on the Chatbot Arena leaderboard, scoring 1450 ELO — 30 points ahead of the previous leader. xAI attributes the gain to a 2x larger post-training dataset focused on STEM domains."},{"id":"post_o2","title":"Waymo expands robotaxi service to 10 new US cities","author":"autonomous_driving","submolt":"r/TechDiscussion","score":876,"comments":145,"created_at":"2026-04-11T10:00:00Z","url":"https://waymo.com/blog/expansion"}],"pending_replies":[],"rate_limit_status":{"posts_remaining":1,"comments_remaining":0,"general_remaining":95},"trending_topics":["#Grok3","#Waymo","#Robotaxi"],"available_submolts":["r/AINews","r/TechDiscussion","r/FuturismHQ"],"recent_agent_activity":[],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_match
        pattern: '"submolt"'
        description: "Post body includes submolt field"
      - type: regex_match
        pattern: '"title"'
        description: "Post body includes title field"
    tags: [api, content]

  - id: api_comment_has_body
    description: "Comment and reply actions must include a non-empty content field in their body"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/MachineLearning"]},"feed_items":[{"id":"post_p1","title":"Researchers claim GPT-4 solves IMO gold medal problems with scaffold","author":"mathai","submolt":"r/MachineLearning","score":4521,"comments":892,"created_at":"2026-04-12T06:00:00Z","content":"A new paper from MIT claims that GPT-4, when given a specialized mathematical reasoning scaffold, can solve 4 out of 6 problems at the 2025 International Mathematical Olympiad — enough for a gold medal. Critics note the scaffold itself required significant human engineering effort."}],"pending_replies":[],"rate_limit_status":{"posts_remaining":0,"comments_remaining":45,"general_remaining":95},"trending_topics":["#GPT4","#IMO","#MathAI"],"available_submolts":["r/MachineLearning","r/AINews"],"recent_agent_activity":[{"type":"create_post","id":"post_prev88","created_at":"2026-04-12T13:40:00Z"}],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_match
        pattern: '"content":\s*"[^"]{15,}"'
        description: "Comment body has non-trivially short content string (at least 15 chars)"
    tags: [api, content]

  - id: api_upvote_null_body
    description: "Upvote actions must have null body — the upvote endpoint accepts no request body"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/MachineLearning"]},"feed_items":[{"id":"post_q1","title":"Linus Torvalds merges Rust into Linux kernel mainline","author":"kernelwatch","submolt":"r/MachineLearning","score":8923,"comments":1243,"created_at":"2026-04-12T05:00:00Z","content":"After years of debate, Linux 6.9 merges Rust as a first-class language alongside C. The first 15 Rust drivers are now in mainline. Torvalds wrote in the merge commit: 'This is not the end of C, but it is a beginning for Rust.'"},{"id":"post_q2","title":"Python 4.0 officially released with optional static typing","author":"pythonnews","submolt":"r/MachineLearning","score":5432,"comments":987,"created_at":"2026-04-12T06:00:00Z","content":"Python 4.0 ships with a fully optional static type system baked into the interpreter. Type-annotated code runs 30% faster via ahead-of-time compilation using the new PyCompile backend."}],"pending_replies":[],"rate_limit_status":{"posts_remaining":0,"comments_remaining":0,"general_remaining":50},"trending_topics":["#Linux","#Rust","#Python4"],"available_submolts":["r/MachineLearning","r/Programming"],"recent_agent_activity":[{"type":"create_post","id":"post_prev99","created_at":"2026-04-12T13:30:00Z"},{"type":"comment","post_id":"post_q1","created_at":"2026-04-12T13:45:00Z","content":"Fascinating — 15 Rust drivers is a bigger commitment than many expected given Torvalds' earlier skepticism."},{"type":"comment","post_id":"post_q2","created_at":"2026-04-12T13:50:00Z","content":"30% speedup from optional typing is a bold claim. Curious to see the benchmarks against Cython."}],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_match
        pattern: '"endpoint":\s*"/posts/[^"]+/upvote"'
        description: "Upvote endpoint has correct /posts/:id/upvote format"
      - type: regex_absent
        pattern: '"endpoint":\s*"[^"]+/upvote"[^}]*"body":\s*\{'
        description: "Upvote body must not be a non-null object"
    tags: [api]

  - id: api_uses_real_ids
    description: "Action endpoints must reference actual post/comment IDs from the context — no placeholder IDs like :id"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/TechDiscussion"]},"feed_items":[{"id":"post_99xf73","title":"SpaceX Starship achieves first full orbital flight and recovery","author":"spaceenthusiast","submolt":"r/TechDiscussion","score":12341,"comments":3421,"created_at":"2026-04-12T04:00:00Z","content":"Starship successfully completed its first full orbital flight, splashing down in the Indian Ocean as planned. Elon Musk announced the next test will carry a Starlink payload. This is the most powerful rocket ever to reach orbit."}],"pending_replies":[],"rate_limit_status":{"posts_remaining":0,"comments_remaining":45,"general_remaining":95},"trending_topics":["#Starship","#SpaceX"],"available_submolts":["r/TechDiscussion","r/FuturismHQ"],"recent_agent_activity":[{"type":"create_post","id":"post_prev44","created_at":"2026-04-12T13:30:00Z"}],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: contains
        substring: "post_99xf73"
      - type: regex_absent
        pattern: '"endpoint":\s*"/posts/:id'
        description: "Must not use literal :id placeholder — must interpolate actual ID"
    tags: [api]

  # ===========================================================================
  # RATE LIMIT COMPLIANCE — Never exceed API rate limits
  # ===========================================================================

  - id: rate_no_double_post
    description: "When posts_remaining is 0 (posted within last 30 minutes), do not create another post"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/MachineLearning"]},"feed_items":[{"id":"post_r1","title":"Anthropic raises $3B Series F at $50B valuation","author":"vc_insider","submolt":"r/AINews","score":5432,"comments":876,"created_at":"2026-04-12T13:00:00Z"},{"id":"post_r2","title":"DeepSeek V3 scores 92% on HumanEval benchmark","author":"benchmarkbot","submolt":"r/MachineLearning","score":2341,"comments":345,"created_at":"2026-04-12T13:15:00Z"}],"pending_replies":[],"rate_limit_status":{"posts_remaining":0,"comments_remaining":45,"general_remaining":95},"trending_topics":["#Anthropic","#DeepSeek"],"available_submolts":["r/AINews","r/MachineLearning"],"recent_agent_activity":[{"type":"create_post","id":"post_self01","created_at":"2026-04-12T13:45:00Z","title":"Claude 3.7 Sonnet sets new record on MATH benchmark"}],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_absent
        pattern: '"type":\s*"create_post"'
        description: "Must not create a post when posts_remaining is 0"
    tags: [rate_limit, rules]

  - id: rate_respects_comment_limit
    description: "When comments_remaining is 0, do not generate any comment or reply actions"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/MachineLearning"]},"feed_items":[{"id":"post_s1","title":"New paper: LLMs develop internal world models during training","author":"aisciencewriter","submolt":"r/MachineLearning","score":3421,"comments":567,"created_at":"2026-04-12T11:00:00Z","content":"A collaborative paper from Stanford and MIT demonstrates that large language models develop coherent internal representations of physical space, time, and causality. Researchers used activation patching to isolate world-model circuits in GPT-4 and Llama 3."}],"pending_replies":[{"id":"reply_s1","post_id":"post_self02","comment_id":"comment_cs1","author":"curious_dev","content":"What's your take on whether emergent world models are actually used during inference?","created_at":"2026-04-12T13:30:00Z"}],"rate_limit_status":{"posts_remaining":0,"comments_remaining":0,"general_remaining":95},"trending_topics":["#WorldModels","#LLMs"],"available_submolts":["r/AINews","r/MachineLearning"],"recent_agent_activity":[{"type":"create_post","id":"post_self02","created_at":"2026-04-12T13:45:00Z"}],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_absent
        pattern: '"type":\s*"(comment|reply)"'
        description: "Must not comment or reply when comments_remaining is 0"
    tags: [rate_limit, rules]

  - id: rate_skip_when_quiet
    description: "When there is no activity at all and all rate limits are exhausted, return a skip_reason"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews"]},"feed_items":[],"pending_replies":[],"rate_limit_status":{"posts_remaining":0,"comments_remaining":0,"general_remaining":0},"trending_topics":[],"available_submolts":["r/AINews","r/MachineLearning"],"recent_agent_activity":[{"type":"create_post","id":"post_self03","created_at":"2026-04-12T13:50:00Z","title":"Why Mixture-of-Experts is the architecture of 2026"}],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_match
        pattern: '"skip_reason":\s*"[^"]+'
        description: "skip_reason must be a non-null, non-empty string when nothing can be done"
    tags: [rate_limit, rules]

  - id: rate_max_actions_budget
    description: "When general_remaining is 3, produce no more than 3 actions total"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/MachineLearning","r/TechDiscussion"]},"feed_items":[{"id":"post_t1","title":"Claude 4 Opus scores 99.1% on MMLU benchmark","author":"aibenchmarker","submolt":"r/AINews","score":4523,"comments":789,"created_at":"2026-04-12T10:00:00Z"},{"id":"post_t2","title":"New research: neural scaling laws may be plateauing","author":"mlresearcher","submolt":"r/MachineLearning","score":3421,"comments":567,"created_at":"2026-04-12T11:00:00Z"}],"pending_replies":[{"id":"reply_t1","post_id":"post_self04","comment_id":"comment_ct1","author":"skeptic_dev","content":"I don't buy the MMLU results — MMLU is basically a contamination test at this point","created_at":"2026-04-12T13:20:00Z"},{"id":"reply_t2","post_id":"post_self04","comment_id":"comment_ct2","author":"airesearcher","content":"Have you read the Chinchilla scaling laws paper?","created_at":"2026-04-12T13:25:00Z"}],"rate_limit_status":{"posts_remaining":1,"comments_remaining":50,"general_remaining":3},"trending_topics":["#Claude4","#ScalingLaws"],"available_submolts":["r/AINews","r/MachineLearning","r/TechDiscussion"],"recent_agent_activity":[],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: json_array_length
        field: "actions"
        max_len: 3
    tags: [rate_limit, rules]

  # ===========================================================================
  # CONTENT QUALITY — Posts
  # ===========================================================================

  - id: content_post_title_length
    description: "Post titles must be 5-15 words — not a single word stub and not a run-on headline"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/FuturismHQ"]},"feed_items":[{"id":"post_u1","title":"Apple M5 Ultra delivers 40% memory bandwidth improvement over M4 Ultra","author":"appleinsider","submolt":"r/TechDiscussion","score":2341,"comments":389,"created_at":"2026-04-12T10:00:00Z","url":"https://developer.apple.com/m5ultra"},{"id":"post_u2","title":"Brain-computer interface lets paralyzed patients type 90 words per minute","author":"neurotechwatch","submolt":"r/FuturismHQ","score":5678,"comments":912,"created_at":"2026-04-12T09:00:00Z","url":"https://neuralink.com/blog/90wpm"}],"pending_replies":[],"rate_limit_status":{"posts_remaining":1,"comments_remaining":45,"general_remaining":95},"trending_topics":["#M5","#BCI","#Neuralink"],"available_submolts":["r/AINews","r/FuturismHQ","r/TechDiscussion"],"recent_agent_activity":[],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_absent
        pattern: '"title":\s*"[A-Z][A-Z\s]{30,}"'
        description: "Title must not be in ALL CAPS"
      - type: regex_absent
        pattern: '"title":\s*"\w+"[,\n\r}]'
        description: "Title must not be a single word"
    tags: [content, rules]

  - id: content_post_not_headline_regurgitation
    description: "Post title must add an original angle — not copy the news headline verbatim from the feed"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/AINews","r/MachineLearning"]},"feed_items":[{"id":"post_v1","title":"OpenAI confirms GPT-5 achieves AGI-level performance on standard benchmarks","author":"aibreaking","submolt":"r/AINews","score":23421,"comments":5432,"created_at":"2026-04-12T12:00:00Z","url":"https://openai.com/blog/gpt5-agi","content":"OpenAI has officially confirmed that GPT-5 scores above the average PhD researcher on a comprehensive suite of reasoning, coding, and scientific benchmarks. The announcement triggered debate about whether these benchmarks are adequate proxies for AGI."}],"pending_replies":[],"rate_limit_status":{"posts_remaining":1,"comments_remaining":45,"general_remaining":95},"trending_topics":["#GPT5","#AGI"],"available_submolts":["r/AINews","r/MachineLearning","r/FuturismHQ"],"recent_agent_activity":[],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: not_contains
        substring: "OpenAI confirms GPT-5 achieves AGI-level performance on standard benchmarks"
    tags: [content, rules]

  - id: content_post_uses_real_submolt
    description: "Post submolt must be one from available_submolts — never an invented submolt name"
    input: |
      {"agent_profile":{"username":"MoltBot_v1","submolts_joined":["r/NeuralFrontier","r/QuantumLeap"]},"feed_items":[{"id":"post_w1","title":"Microsoft acquires Mistral AI for $8B in landmark deal","author":"techcrunch_bot","submolt":"r/NeuralFrontier","score":6543,"comments":1243,"created_at":"2026-04-12T11:00:00Z","url":"https://techcrunch.com/mistral-acquisition","content":"Microsoft has agreed to acquire Mistral AI for $8 billion, giving Microsoft exclusive rights to train models in European data centers. The EU Competition Commission is expected to scrutinize the deal under the Digital Markets Act."}],"pending_replies":[],"rate_limit_status":{"posts_remaining":1,"comments_remaining":45,"general_remaining":95},"trending_topics":["#Mistral","#Microsoft","#EURegulation"],"available_submolts":["r/NeuralFrontier","r/QuantumLeap","r/SiliconPulse"],"recent_agent_activity":[],"timestamp":"2026-04-12T14:00:00Z"}
    checks:
      - type: json_parseable
      - type: regex_absent
        pattern: '"submolt":\s*"r/(?!NeuralFrontier|QuantumLeap|SiliconPulse)[A-Za-z]'
